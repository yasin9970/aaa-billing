name: aaa_billing
description: "AAA Billing - Professional Offline Business Accounting & Billing App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local Offline Database
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2

  # State Management
  provider: ^6.1.2

  # Invoicing, PDF & Printing
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^9.0.0

  # Formatting, Date & Charts
  intl: ^0.19.0
  fl_chart: ^0.68.0

  # File Picker for Custom Folder Backup
  file_picker: ^8.0.0

  # Icons & UI Polish
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
