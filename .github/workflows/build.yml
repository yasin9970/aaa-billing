name: Build AAA Billing APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android project if needed
        run: |
          if [ ! -d "android" ]; then
            flutter create . --org com.aaabilling.app --project-name aaa_billing
          fi
          # Force Android SDK 34 for all plugins & bypass strict AAR checks
          echo "android.suppressUnsupportedCompileSdk=33,34,35,36" >> android/gradle.properties
          echo "android.experimental.disableCompileSdkChecks=true" >> android/gradle.properties
          
          if [ -f "android/build.gradle" ]; then
            cat << 'EOF_GRADLE' >> android/build.gradle
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 34
            }
        }
    }
}
EOF_GRADLE
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AAABilling-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
