name: Build AAA Billing APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Recreate Android Platform
        run: |
          rm -rf android
          flutter create . --platforms=android --no-pub

      - name: Set compileSdk 34 and minSdk 21
        run: |
          python3 -c "
          import os

          p_kts = 'android/app/build.gradle.kts'
          if os.path.exists(p_kts):
              with open(p_kts, 'r') as f:
                  c = f.read()
              c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
              c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
              c = c.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 34')
              with open(p_kts, 'w') as f:
                  f.write(c)
              print('Successfully updated ' + p_kts)

          p_groovy = 'android/app/build.gradle'
          if os.path.exists(p_groovy):
              with open(p_groovy, 'r') as f:
                  c = f.read()
              c = c.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 34')
              c = c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
              c = c.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 34')
              with open(p_groovy, 'w') as f:
                  f.write(c)
              print('Successfully updated ' + p_groovy)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Apply Custom App Launcher Icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          if [ -f "assets/icon/app_icon.png" ]; then
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "Custom app icon applied successfully!"
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAA-Billing-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
