name: Build AAA Billing APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Platform
        run: flutter create . --platforms=android --no-pub

      - name: Force Android SDK 34 & minSdk 21
        run: |
          python3 -c '
          import os, re

          # 1. Update android/app/build.gradle.kts
          target = "android/app/build.gradle.kts"
          if os.path.exists(target):
              with open(target, "r") as f:
                  txt = f.read()
              txt = re.sub(r"compileSdk\s*=.*", "compileSdk = 34", txt)
              txt = re.sub(r"minSdk\s*=.*", "minSdk = 21", txt)
              txt = re.sub(r"targetSdk\s*=.*", "targetSdk = 34", txt)
              with open(target, "w") as f:
                  f.write(txt)
              print("Updated " + target)

          # 2. Update all subprojects (printing, share_plus) to compile with SDK 34
          root_target = "android/build.gradle.kts"
          if os.path.exists(root_target):
              with open(root_target, "a") as f:
                  f.write("""
          subprojects {
              afterEvaluate {
                  if (project.hasProperty("android")) {
                      val android = project.extensions.findByName("android")
                      if (android != null) {
                          try {
                              val m = android.javaClass.getMethod("compileSdkVersion", Int::class.javaPrimitiveType)
                              m.invoke(android, 34)
                          } catch (_: Exception) {}
                      }
                  }
              }
          }
          """)
              print("Configured subprojects in " + root_target)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Apply Custom App Launcher Icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          if [ -f "assets/icon/app_icon.png" ] && [ -s "assets/icon/app_icon.png" ]; then
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "Custom app icon applied successfully!"
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAA-Billing-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
