name: Build AAA Billing APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Platform
        run: flutter create . --platforms=android --no-pub

      - name: Configure Android SDK 34
        run: |
          python3 -c "
          import re, os
          for f in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if os.path.exists(f):
                  with open(f, 'r') as fp:
                      text = fp.read()
                  text = re.sub(r'compileSdk(Version)?\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 34', text)
                  text = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 34', text)
                  text = re.sub(r'minSdk(Version)?\s*=\s*flutter\.minSdkVersion', 'minSdk = 21', text)
                  text = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', text)
                  text = re.sub(r'targetSdk(Version)?\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 34', text)
                  text = re.sub(r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 34', text)
                  with open(f, 'w') as fp:
                      fp.write(text)
                  print(f'Configured {f}')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Apply Custom App Launcher Icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          if [ -f "assets/icon/app_icon.png" ]; then
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "Custom app icon applied successfully!"
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAA-Billing-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
