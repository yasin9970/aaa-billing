name: Build AAA Billing APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --no-pub

      - name: Set minSdk 23 and compileSdk 34
        run: |
          cat << 'KTS' > android/app/build.gradle.kts
plugins {
    id("com.android.application")
    id("kotlin-android")
    id("dev.flutter.flutter-gradle-plugin")
}

android {
    namespace = "com.example.aaa_billing"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.example.aaa_billing"
        minSdk = 23
        targetSdk = 34
        versionCode = 1
        versionName = "1.0.0"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.getByName("debug")
        }
    }
}

flutter {
    source = "../.."
}
KTS

      - name: Install Dependencies
        run: flutter pub get

      - name: Set Custom App Launcher Icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            if [ -f "assets/icon/app_icon.png" ]; then
              cp assets/icon/app_icon.png "android/app/src/main/res/$dir/ic_launcher.png"
            fi
          done

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAA-Billing-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
