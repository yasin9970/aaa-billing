name: Build AAA Billing APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --no-pub

      - name: Configure SDK 35 & minSdk 21
        run: |
          python3 -c "
          f = 'android/app/build.gradle.kts'
          with open(f, 'r') as fp:
              c = fp.read()
          c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 35')
          c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
          c = c.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 35')
          with open(f, 'w') as fp:
              fp.write(c)

          gp = 'android/gradle.properties'
          with open(gp, 'a') as fp:
              fp.write('\nandroid.suppressUnsupportedCompileSdk=35\n')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Custom App Launcher Icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            if [ -f "assets/icon/app_icon.png" ]; then
              cp assets/icon/app_icon.png "android/app/src/main/res/$dir/ic_launcher.png"
            fi
          done

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAA-Billing-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
